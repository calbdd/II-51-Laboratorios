<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab05 - Formularios Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-lg">
            <span class="navbar-brand mb-0 h1"><i class="fas fa-flask"></i> Lab05 - Formularios Bootstrap</span>
            <a href="../index.html" class="btn btn-light btn-sm">Volver</a>
        </div>
    </nav>

    <div class="container-lg mt-5">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-users"></i> Agregar Estudiante</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" required>
                            </div>
                            <div class="mb-3">
                                <label for="matricula" class="form-label">Matrícula</label>
                                <input type="text" class="form-control" id="matricula" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-lg mt-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-book"></i> Agregar Curso</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="curso" class="form-label">Nombre del Curso</label>
                                <input type="text" class="form-control" id="curso" required>
                            </div>
                            <div class="mb-3">
                                <label for="codigo" class="form-label">Código</label>
                                <input type="text" class="form-control" id="codigo" required>
                            </div>
                            <div class="mb-3">
                                <label for="creditos" class="form-label">Créditos</label>
                                <input type="number" class="form-control" id="creditos" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100"><i class="fas fa-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-lg mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-chalkboard-user"></i> Agregar Profesor</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="nombreProf" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombreProf" required>
                            </div>
                            <div class="mb-3">
                                <label for="correoProf" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correoProf" required>
                            </div>
                            <div class="mb-3">
                                <label for="departamento" class="form-label">Departamento</label>
                                <input type="text" class="form-control" id="departamento" required>
                            </div>
                            <button type="submit" class="btn btn-info w-100"><i class="fas fa-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center mt-5 py-4">
        <p class="mb-0">Lab05 - Formularios Bootstrap para Sistema Académico</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
